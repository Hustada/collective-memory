<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Collective Memory — Visualizer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0a0a0f;
      --surface: #14141f;
      --border: #2a2a3a;
      --text: #c8c8d4;
      --text-dim: #6a6a7a;
      --accent: #d4a574;
      --accent-dim: #8a6a4a;
      --panel-width: 260px;
    }

    body {
      font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      grid-template-columns: 1fr;
      overflow: hidden;
    }

    /* ── Header ─────────────────────────────────────────────── */
    header {
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      z-index: 20;
    }

    header h1 {
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
      white-space: nowrap;
    }

    header .search-box {
      flex: 1;
      min-width: 140px;
      max-width: 320px;
    }

    header input {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 5px 10px;
      font-family: inherit;
      font-size: 11px;
      border-radius: 4px;
      outline: none;
    }

    header input:focus { border-color: var(--accent-dim); }

    .toggle-group {
      display: flex;
      gap: 3px;
    }

    .panel-btn, .toggle-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-dim);
      padding: 4px 8px;
      font-family: inherit;
      font-size: 11px;
      cursor: pointer;
      border-radius: 3px;
      white-space: nowrap;
    }

    .panel-btn:hover, .toggle-btn:hover { border-color: var(--accent-dim); }
    .panel-btn.active, .toggle-btn.active {
      background: var(--accent-dim);
      color: var(--text);
      border-color: var(--accent);
    }

    .header-right {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-left: auto;
    }

    /* ── Main area (chart is always full width in grid) ────── */
    .main-area {
      position: relative;
      overflow: hidden;
    }

    /* ── Chart ──────────────────────────────────────────────── */
    .chart-area {
      position: absolute;
      inset: 0;
    }

    .chart-area svg {
      width: 100%;
      height: 100%;
    }

    .tooltip {
      position: absolute;
      pointer-events: none;
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 8px 12px;
      border-radius: 4px;
      font-size: 11px;
      max-width: 280px;
      white-space: pre-wrap;
      display: none;
      z-index: 30;
    }

    /* ── Slide-over panels ─────────────────────────────────── */
    .panel-overlay {
      position: absolute;
      top: 0;
      bottom: 0;
      width: var(--panel-width);
      background: var(--bg);
      border: 0 solid var(--border);
      z-index: 15;
      overflow-y: auto;
      transition: transform 0.2s ease;
      padding: 14px;
      font-size: 12px;
    }

    .panel-overlay.left {
      left: 0;
      border-right-width: 1px;
      transform: translateX(-100%);
    }

    .panel-overlay.right {
      right: 0;
      border-left-width: 1px;
      transform: translateX(100%);
    }

    .panel-overlay.open { transform: translateX(0); }

    .panel-overlay h3 {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-dim);
      margin-bottom: 6px;
      margin-top: 14px;
    }

    .panel-overlay h3:first-child { margin-top: 0; }

    /* ── Filter items ──────────────────────────────────────── */
    .filter-item {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 2px 0;
      cursor: pointer;
      font-size: 11px;
    }

    .filter-item input[type="checkbox"] { accent-color: var(--accent); }

    .filter-item .swatch {
      width: 10px;
      height: 10px;
      border-radius: 2px;
      flex-shrink: 0;
    }

    .filter-item .count {
      margin-left: auto;
      color: var(--text-dim);
      font-size: 10px;
    }

    /* ── Detail panel ──────────────────────────────────────── */
    .detail-content {
      line-height: 1.6;
      margin-bottom: 14px;
      color: var(--text);
      word-wrap: break-word;
      overflow-wrap: break-word;
    }

    .meta-row {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      padding: 4px 0;
      border-bottom: 1px solid var(--border);
    }

    .meta-label {
      color: var(--text-dim);
      flex-shrink: 0;
    }

    .meta-value {
      color: var(--accent);
      text-align: right;
      word-break: break-all;
      min-width: 0;
    }

    .empty-state {
      color: var(--text-dim);
      font-style: italic;
      margin-top: 40px;
      text-align: center;
    }

    .tag {
      display: inline-block;
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 2px 6px;
      border-radius: 3px;
      font-size: 10px;
      margin: 2px;
      color: var(--text-dim);
    }

    /* ── Memory list (breakdown drill-down) ───────────────── */
    .memory-list-item {
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
    }

    .memory-list-item:hover { background: var(--surface); }

    .memory-list-item .memory-text {
      font-size: 11px;
      line-height: 1.5;
      color: var(--text);
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .memory-list-item .memory-meta {
      font-size: 9px;
      color: var(--text-dim);
      margin-top: 3px;
    }

    /* ── Stats bar ─────────────────────────────────────────── */
    footer {
      padding: 6px 16px;
      border-top: 1px solid var(--border);
      font-size: 10px;
      color: var(--text-dim);
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      z-index: 20;
    }

    footer .stat-label { color: var(--text-dim); }
    footer .stat-value { color: var(--text); margin-left: 3px; }
  </style>
</head>
<body>
  <header>
    <h1>Collective Memory</h1>
    <div class="search-box">
      <input type="text" id="search" placeholder="Search memories...">
    </div>
    <div class="header-right">
      <div class="toggle-group">
        <button class="toggle-btn active" data-mode="umap">UMAP</button>
        <button class="toggle-btn" data-mode="timeline">Timeline</button>
        <button class="toggle-btn" data-mode="breakdown">Breakdown</button>
      </div>
      <button class="panel-btn" id="toggle-filters">Filters</button>
      <button class="panel-btn" id="toggle-detail">Detail</button>
    </div>
  </header>

  <div class="main-area">
    <main class="chart-area" id="chart">
      <div class="tooltip" id="tooltip"></div>
    </main>

    <aside class="panel-overlay left" id="filters"></aside>
    <aside class="panel-overlay right" id="detail">
      <p class="empty-state">Click a node to view details</p>
    </aside>
  </div>

  <footer id="stats"></footer>

  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="viz.js"></script>
</body>
</html>
